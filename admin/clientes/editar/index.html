<head>

<meta name="robots" content="noindex">

<body class="panel" data-seccion="clientes" data-ruta="Clientes|Nuevo" data-raiz="../../../">

<main class="pn-pagina" id="contenido" aria-busy="true">
  <div class="pn-cabecera">
    <div>
      <p class="pn-antetitulo" id="antetitulo">Clientes · nuevo</p>
      <h1 id="titulo">Nuevo cliente</h1>
      <p class="pn-subtitulo" id="subtitulo">Familia, colegio, AMPA, ayuntamiento o empresa.</p>
    </div>
  </div>
  <div id="formulario"><div class="pn-tarjeta pn-cuerpo"><span class="pn-esqueleto" style="width:60%"></span></div></div>
</main>

<dialog class="pn-modal" id="modal-unir" aria-labelledby="unir-titulo">
  <div class="pn-cuerpo">
    <h2 id="unir-titulo">¿Unir a estas dos personas?</h2>
    <p id="unir-detalle"></p>
  </div>
  <form method="dialog" class="pn-pie">
    <button class="pn-boton" value="no" autofocus>Cancelar</button>
    <button class="pn-boton primario" value="si">Unir</button>
  </form>
</dialog>
