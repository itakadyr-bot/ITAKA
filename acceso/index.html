<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — Ítaka Deporte y Recreación</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/itaka.css">
<link rel="stylesheet" href="../assets/css/web.css">
</head>
<body class="web" style="min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff 0%,var(--w-nube) 100%)">

<main style="margin:auto;width:100%;max-width:440px;padding:40px 16px;box-sizing:border-box">
  <a href="../" style="display:flex;justify-content:center;margin-bottom:28px"><img src="../assets/img/logo-color.png" alt="Ítaka Deporte y Recreación" width="155" height="52" style="height:52px;width:auto"></a>
  <form id="form-acceso" class="w-form">
    <h1 style="font-size:clamp(28px,6vw,34px)">Acceso de administración</h1>
    <p style="margin:0 0 4px;font-size:15px;line-height:1.5;color:var(--w-gris)">Para editar la web. Si has llegado aquí por error, <a href="../">vuelve a la portada</a>.</p>
    <label style="display:grid;gap:6px;margin:0">Correo
      <input id="acceso-correo" type="email" required autocomplete="username" placeholder="itakadyr@gmail.com">
    </label>
    <label style="display:grid;gap:6px;margin:0">Contraseña
      <input id="acceso-clave" type="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="w-boton" style="width:100%;margin-top:4px">Entrar</button>
    <p id="acceso-aviso" style="margin:0;font-size:14px;line-height:1.5;color:var(--w-gris)" aria-live="polite"></p>
  </form>
</main>

<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/db.js"></script>
<script>
(function () {
  'use strict';
  var form = document.getElementById('form-acceso');
  var aviso = document.getElementById('acceso-aviso');

  /* Si ya hay sesión y se viene del panel, directamente de vuelta. */
  var volverYa = new URLSearchParams(location.search).get('volver') || '';
  if (/^\/[A-Za-z0-9\/._?=&%-]*$/.test(volverYa) && volverYa.indexOf('//') < 0 && window.ITAKA.haySesionGuardada()) {
    window.ITAKA.conCliente().then(function (c) { return c.auth.getSession(); }).then(function (r) {
      if (r && r.data && r.data.session) location.replace(volverYa);
    }).catch(function () { /* sin sesión válida: se queda el formulario */ });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    aviso.style.color = '#8494a4';
    aviso.textContent = 'Comprobando…';
    window.ITAKA.conCliente().then(function (cliente) {
      return cliente.auth.signInWithPassword({
        email: document.getElementById('acceso-correo').value.trim(),
        password: document.getElementById('acceso-clave').value
      });
    }).then(function (r) {
      if (r.error) throw r.error;
      aviso.style.color = '#14202e';
      /* ?volver=/admin/clientes/ → tras entrar, de vuelta al panel.
         Solo rutas de esta misma web: nada de saltar a otro dominio. */
      var volver = new URLSearchParams(location.search).get('volver') || '';
      var seguro = /^\/[A-Za-z0-9\/._?=&%-]*$/.test(volver) && volver.indexOf('//') < 0;
      aviso.textContent = seguro ? 'Dentro. Volviendo a la gestión…' : 'Dentro. Llevándote a la portada…';
      location.href = seguro ? volver : '../';
    }).catch(function (err) {
      aviso.style.color = '#b42318';
      aviso.textContent = /credential/i.test(err.message || '')
        ? 'Correo o contraseña incorrectos.'
        : 'No se pudo entrar: ' + (err.message || 'error desconocido');
    });
  });
})();
</script>
</body>
</html>
